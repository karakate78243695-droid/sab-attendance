<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบเช็คชื่อนักเรียนด้วยบาร์โค้ด</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="เช็คชื่อ">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   SAB · Styles.html — macOS theme · base · shell · components
   ═══════════════════════════════════════════════════════════════ */
:root{
  --blue:#0a84ff; --blue2:#5e5ce6; --blue-d:#0060df;
  --indigo:#5e5ce6; --grad:linear-gradient(135deg,#0a84ff,#5e5ce6);
  --green:#34c759; --orange:#ff9f0a; --red:#ff3b30; --purple:#5e5ce6; --pink:#ff2d92; --teal:#30c8c9;
  --bg:#ecedf1; --bg2:#f5f5f7; --card:#ffffff; --card2:#fbfbfd;
  --ink:#1d1d1f; --ink2:#3a3a3c; --muted:#86868b; --line:#e3e3e8; --line2:#d2d2d7;
  --sidebar:rgba(245,245,247,.72); --shadow:0 10px 40px rgba(0,0,0,.12); --shadow-sm:0 2px 10px rgba(0,0,0,.06);
  --radius:18px; --radius-sm:12px;
}
[data-theme="blue"]{--blue:#0a84ff;--blue2:#5e5ce6;--blue-d:#0060df;--grad:linear-gradient(135deg,#0a84ff,#5e5ce6)}
[data-theme="green"]{--blue:#34c759;--blue2:#30c8c9;--blue-d:#248a3d;--grad:linear-gradient(135deg,#34c759,#30c8c9)}
[data-theme="purple"]{--blue:#5e5ce6;--blue2:#bf5af2;--blue-d:#3634a3;--grad:linear-gradient(135deg,#5e5ce6,#bf5af2)}
[data-theme="orange"]{--blue:#ff9500;--blue2:#ff375f;--blue-d:#c93400;--grad:linear-gradient(135deg,#ff9500,#ff375f)}
[data-theme="pink"]{--blue:#ff2d92;--blue2:#ff375f;--blue-d:#c70063;--grad:linear-gradient(135deg,#ff2d92,#ff6482)}
[data-theme="graphite"]{--blue:#48484a;--blue2:#8e8e93;--blue-d:#2c2c2e;--grad:linear-gradient(135deg,#48484a,#8e8e93)}

*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body.sab-doc{font-family:'Sarabun','Kanit',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-weight:400}
h1,h2,h3,h4,h5,h6,.font-display,button,.btn,.nav-title{font-family:'Kanit','Sarabun',system-ui,sans-serif}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::selection{background:rgba(10,132,255,.18)}

/* ── Boot loader ── */
.boot-loader{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef1f6,#f5f5f7)}
.boot-loader[hidden]{display:none!important}
.boot-card{display:flex;flex-direction:column;align-items:center;gap:14px}
.boot-ring{position:relative;display:flex;align-items:center;justify-content:center;width:84px;height:84px}
.boot-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid rgba(10,132,255,.16);border-top-color:var(--blue);animation:spin 1s linear infinite}
.boot-ring i{font-size:34px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.boot-name{font-family:'Kanit';font-weight:700;font-size:18px;color:var(--ink)}
.boot-text{font-size:13px;color:var(--muted)}
.boot-dots{display:flex;gap:6px}.boot-dots span{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:bdot 1.2s ease-in-out infinite}
.boot-dots span:nth-child(2){animation-delay:.2s}.boot-dots span:nth-child(3){animation-delay:.4s}
@keyframes bdot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Spinner overlay ── */
.spin-overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(245,245,247,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.spin-overlay[hidden]{display:none!important}
.spin-card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:22px;padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow);min-width:230px}
.spin-q{position:relative;width:64px;height:64px}
.spin-q::before,.spin-q::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid transparent}
.spin-q::before{border-top-color:var(--blue);border-right-color:var(--blue2);animation:spin 1.1s linear infinite}
.spin-q::after{inset:9px;border-bottom-color:var(--blue2);animation:spin 1.5s linear infinite reverse}
.spin-q i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--blue)}
.spin-msg{font-family:'Kanit';font-weight:600;font-size:14px;color:var(--ink)}
.spin-sub{font-size:12px;color:var(--muted);min-height:16px}
.spin-bar{width:160px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.spin-bar::after{content:'';display:block;width:40%;height:100%;background:var(--grad);border-radius:4px;animation:sweep 1.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

/* ── Shell (macOS window) ── */
#app-root{min-height:100vh}
.shell{display:flex;align-items:stretch;min-height:100vh;width:100%}
.sidebar{flex:0 0 256px;width:256px;background:var(--sidebar);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:30}
.sb-traffic{display:flex;gap:8px;padding:16px 18px 6px}
.sb-traffic span{width:12px;height:12px;border-radius:50%}
.sb-traffic span:nth-child(1){background:#ff5f57}.sb-traffic span:nth-child(2){background:#febc2e}.sb-traffic span:nth-child(3){background:#28c840}
.sb-brand{display:flex;align-items:center;gap:11px;padding:6px 18px 16px;border-bottom:1px solid var(--line)}
.sb-logo{width:42px;height:42px;border-radius:13px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 6px 16px rgba(10,132,255,.3)}
.sb-brand-t{font-family:'Kanit';font-weight:700;font-size:14px;line-height:1.2}
.sb-brand-s{font-size:11px;color:var(--muted)}
.sb-clock{margin:12px 14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line);text-align:center}
.sb-clock-time{font-family:'Kanit';font-weight:700;font-size:24px;letter-spacing:.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.sb-clock-date{font-size:11px;color:var(--muted);margin-top:2px}
.sb-nav{flex:1;padding:6px 12px;overflow-y:auto}
.sb-cat{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 5px;display:flex;align-items:center;gap:6px}
.sb-cat::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--blue)}
.sb-link{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--ink2);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;position:relative;transition:all .18s}
.sb-link i{font-size:17px;width:20px;text-align:center;color:var(--muted)}
.sb-link:hover{background:rgba(0,0,0,.045)}
.sb-link.active{background:#fff;color:var(--blue);box-shadow:var(--shadow-sm);font-weight:600}
.sb-link.active i{color:var(--blue)}
.sb-link.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--grad)}
.sb-link.is-logout{color:var(--red)}.sb-link.is-logout i{color:var(--red)}
.sb-user{margin:10px 14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sb-ava{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden;flex-shrink:0}
.sb-ava img{width:100%;height:100%;object-fit:cover}
.sb-user-n{font-size:12.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;margin-top:3px}
.role-chip-admin{background:linear-gradient(135deg,#fde68a,#fbbf24);color:#78350f}
.role-chip-teacher{background:linear-gradient(135deg,#a7f3d0,#34d399);color:#065f46}

.main-area{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:12px;padding:12px 22px;background:rgba(245,245,247,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.tb-burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:18px;cursor:pointer}
.tb-title{font-family:'Kanit';font-weight:700;font-size:17px;flex:1;min-width:0;display:flex;align-items:center;gap:9px}
.tb-title .tb-ic{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.tb-title small{display:block;font-size:11px;color:var(--muted);font-weight:400;font-family:'Sarabun'}
.tb-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--ink2)}
.tb-pill .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,199,89,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}70%{box-shadow:0 0 0 8px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
.tb-prof{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;overflow:hidden;border:2px solid #fff;box-shadow:var(--shadow-sm)}
.tb-prof img{width:100%;height:100%;object-fit:cover}
.page-wrap{flex:1;padding:22px;max-width:1180px;width:100%;margin:0 auto}

/* profile popover */
.prof-pop{display:none;position:absolute;top:54px;right:18px;width:250px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:60;overflow:hidden;animation:popIn .18s ease}
.prof-pop.show{display:block}
@keyframes popIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.pp-head{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.pp-item{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:13px;color:var(--ink2);cursor:pointer}
.pp-item:hover{background:rgba(0,0,0,.04)}.pp-item i{font-size:16px;width:18px}
.pp-item.danger{color:var(--red)}.pp-divider{height:1px;background:var(--line)}

/* ── Buttons (multi-state) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .18s;font-family:'Kanit';position:relative;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(10,132,255,.28)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(10,132,255,.34)}
.btn-ghost{background:#fff;border-color:var(--line2);color:var(--ink2)}
.btn-ghost:hover{background:var(--bg2);border-color:var(--blue)}
.btn-danger{background:linear-gradient(135deg,#ff453a,#ff3b30);color:#fff;box-shadow:0 6px 16px rgba(255,59,48,.26)}
.btn-soft{background:rgba(10,132,255,.1);color:var(--blue)}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:13px}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn[data-state="loading"]{pointer-events:none}
.btn[data-state="loading"],.btn[data-state="success"],.btn[data-state="error"]{opacity:1!important}
.btn[data-state="success"]{background:linear-gradient(135deg,#34c759,#30b350)!important;color:#fff!important}
.btn[data-state="error"]{background:linear-gradient(135deg,#ff453a,#ff3b30)!important;color:#fff!important}
.spin-inline{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
.btn-icon{width:38px;height:38px;padding:0;border-radius:11px}

/* ── Cards / surfaces ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;margin-bottom:16px}
.panel-h{display:flex;align-items:center;gap:9px;font-family:'Kanit';font-weight:700;font-size:15px;margin-bottom:14px}
.panel-h i{color:var(--blue)}
.panel-h .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto}

/* ── Hero ── */
.hero{position:relative;overflow:hidden;border-radius:var(--radius);padding:22px 24px;color:#fff;background:var(--grad);box-shadow:0 14px 36px rgba(10,132,255,.28);margin-bottom:18px}
.hero::before{content:'';position:absolute;top:-50%;right:-8%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 62%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-60%;left:10%;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 62%);pointer-events:none}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.hero-ava{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
.hero-ava img{width:100%;height:100%;object-fit:cover}
.hero-greet{font-size:13px;opacity:.92}
.hero-name{font-family:'Kanit';font-weight:800;font-size:22px;line-height:1.15}
.hero-sub{font-size:12.5px;opacity:.88;margin-top:2px}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px;position:relative;z-index:1}
.hero-stat{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px}
.hero-stat-v{font-family:'Kanit';font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.hero-stat-l{font-size:11px;opacity:.9}

/* ── Stat cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .2s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.stat-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;margin-bottom:9px}
.stat-v{font-family:'Kanit';font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.stat-l{font-size:12px;color:var(--muted);margin-top:3px}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.b-present{background:rgba(52,199,89,.15);color:#1a7f37}
.b-late{background:rgba(255,159,10,.16);color:#9a6700}
.b-absent{background:rgba(255,59,48,.14);color:#c0271e}
.b-leave{background:rgba(94,92,230,.14);color:#3634a3}
.b-none{background:#f0f0f3;color:var(--muted)}

/* ── Forms ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field label .req{color:var(--red)}
.input,.select,.textarea{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:11px;font-size:14px;font-family:'Sarabun';background:#fff;color:var(--ink);transition:all .18s;box-sizing:border-box}
.input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(10,132,255,.13)}
.textarea{min-height:80px;resize:vertical}
.field-hint{font-size:11px;color:var(--muted);margin-top:5px}
.field.has-error .input,.field.has-error .select{border-color:var(--red);background:#fff5f5}
.field-error{font-size:11.5px;color:var(--red);margin-top:5px;display:flex;align-items:center;gap:5px}
.input-wrap{position:relative}
.input-wrap .iw-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.input-wrap .input{padding-left:40px}

/* ── empty / skeleton ── */
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty i{font-size:46px;color:var(--line2);display:block;margin-bottom:12px}
.empty p{font-size:14px;margin:0 0 4px}
.sk{background:linear-gradient(90deg,#eef0f3 0%,#f6f7f9 50%,#eef0f3 100%);background-size:200% 100%;animation:sk 1.5s ease-in-out infinite;border-radius:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Toast (custom + Swal theme) ── */
.swal2-popup{font-family:'Kanit','Sarabun',sans-serif!important;border-radius:20px!important}
.swal2-title{font-family:'Kanit'!important;font-weight:700!important;font-size:19px!important}
.swal2-styled.swal2-confirm{background:var(--grad)!important;border-radius:11px!important;box-shadow:0 6px 16px rgba(10,132,255,.3)!important}
.swal2-styled.swal2-cancel{border-radius:11px!important}
.swal2-toast{border-left:4px solid var(--blue)!important}
.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:8px;width:calc(100% - 28px);max-width:380px;pointer-events:none}
.toast{pointer-events:auto;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:13.5px;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.05)}
.toast.out{animation:toastOut .3s ease forwards}
.toast .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.toast.success .ic{background:var(--green)}.toast.error .ic{background:var(--red)}.toast.warning .ic{background:var(--orange)}.toast.info .ic{background:var(--blue)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px)}}
</style>

<style>
/* ═══════════════════════════════════════════════════════════════
   SAB · Styles2.html — login · modal · room cards · scanner · dashboard · responsive · print
   ═══════════════════════════════════════════════════════════════ */

/* ── Login (macOS window) ── */
.login-stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 80% -10%,rgba(94,92,230,.16),transparent),radial-gradient(900px 500px at 0% 100%,rgba(10,132,255,.16),transparent),linear-gradient(160deg,#eef1f6,#f5f5f7)}
.login-win{width:100%;max-width:960px;background:rgba(255,255,255,.78);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.6);border-radius:22px;box-shadow:0 40px 90px rgba(0,0,0,.22);overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr;animation:winIn .5s cubic-bezier(.2,.9,.3,1.05)}
@keyframes winIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.login-bar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.4)}
.login-bar span{width:12px;height:12px;border-radius:50%}
.login-bar span:nth-child(1){background:#ff5f57}.login-bar span:nth-child(2){background:#febc2e}.login-bar span:nth-child(3){background:#28c840}
.login-bar .lb-t{margin-left:8px;font-size:12px;color:var(--muted);font-family:'Kanit';width:auto;height:auto;border-radius:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:14px}
.login-brand{padding:34px 32px;background:var(--grad);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.login-brand::before{content:'';position:absolute;top:-30%;right:-20%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 60%);pointer-events:none;animation:float1 14s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-16px,14px)}}
.lb-logo{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:18px;border:2px solid rgba(255,255,255,.3);position:relative;z-index:1}
.lb-tag{font-family:'Kanit';font-weight:800;font-size:27px;line-height:1.2;position:relative;z-index:1}
.lb-sub{font-size:13.5px;opacity:.92;margin-top:8px;line-height:1.6;position:relative;z-index:1}
.lb-feats{margin-top:24px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.lb-feat{display:flex;align-items:center;gap:11px;font-size:13px}
.lb-feat i{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.lb-feat b{display:block;font-family:'Kanit';font-weight:600;font-size:13.5px}
.lb-feat small{opacity:.85;font-size:11.5px}
.login-form-wrap{padding:34px 32px;display:flex;flex-direction:column;justify-content:center}
.lf-mini{display:none;align-items:center;gap:10px;margin-bottom:18px}
.lf-mini .mi-logo{width:44px;height:44px;border-radius:13px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px}
.lf-title{font-family:'Kanit';font-weight:800;font-size:23px}
.lf-desc{font-size:13px;color:var(--muted);margin:3px 0 20px}
.lf-toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:0;border:0;color:var(--muted);cursor:pointer;font-size:16px}
.lf-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px;font-size:12.5px}
.lf-check{display:flex;align-items:center;gap:7px;color:var(--ink2);cursor:pointer}
.lf-forgot{color:var(--blue);cursor:pointer}
.lf-submit{width:100%;height:50px;position:relative;overflow:hidden;display:block}
.lf-submit-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;visibility:hidden;transition:opacity .25s}
.lf-submit-state.on{opacity:1;visibility:visible}
.lf-foot-links{margin-top:18px;text-align:center;display:flex;flex-direction:column;gap:10px}
.lf-manual-btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:9px;border:1px solid var(--line2);border-radius:11px;background:#fff;font-size:13px;color:var(--ink2);cursor:pointer;font-family:'Kanit';font-weight:600}
.lf-manual-btn:hover{border-color:var(--blue);color:var(--blue)}

/* demo cards */
.lf-demo{margin-top:18px;border:1px dashed rgba(10,132,255,.3);border-radius:14px;padding:12px;background:rgba(10,132,255,.04)}
.lf-demo-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:10px}
.lf-demo-pill{margin-left:auto;padding:2px 8px;border-radius:99px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f;font-size:10px;font-weight:700}
.lf-demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lf-demo-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 6px;background:#fff;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:all .18s;position:relative}
.lf-demo-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--blue)}
.lf-demo-card:active{transform:scale(.96)}
.lf-demo-card.loading{opacity:.6;pointer-events:none}
.lf-demo-ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.lf-demo-card[data-role="admin"] .lf-demo-ic{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#78350f}
.lf-demo-card[data-role="teacher"] .lf-demo-ic{background:linear-gradient(135deg,#a7f3d0,#34d399);color:#065f46}
.lf-demo-role{font-size:11.5px;font-weight:700}
.lf-demo-user{font-size:10px;color:var(--muted);font-family:monospace}
.lf-demo-note{font-size:11px;color:var(--muted);text-align:center;margin-top:9px}

/* ── Footer ── */
.app-footer{margin:16px 22px;padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px;color:var(--ink2);position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.app-footer::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
.af-year{background:var(--grad);color:#fff;padding:3px 10px;border-radius:99px;font-weight:800;font-variant-numeric:tabular-nums;font-family:'Kanit'}
.af-dev{display:flex;align-items:center;gap:11px}
.af-dev-link{position:relative;display:block;transition:transform .2s}
.af-dev-link:hover{transform:scale(1.08)}
.af-dev-logo{width:40px;height:40px;border-radius:50%;border:2px solid #fff;object-fit:cover;box-shadow:0 4px 12px rgba(10,132,255,.25)}
.af-dev-name{font-weight:700;font-family:'Kanit'}
.af-dev a{color:var(--blue)}

/* ── Modal (macOS sheet) ── */
#modal-host{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.32);backdrop-filter:blur(6px)}
#modal-host.is-open{display:flex}
.modal-card{width:100%;max-width:540px;max-height:90vh;background:var(--card);border-radius:20px;box-shadow:0 40px 90px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;animation:mIn .3s cubic-bezier(.2,.9,.3,1.05)}
.modal-card.lg{max-width:820px}
@keyframes mIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.md-head{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);position:relative}
.md-head .md-ic{width:36px;height:36px;border-radius:11px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.md-title{font-family:'Kanit';font-weight:700;font-size:16px;flex:1}
.md-close{width:30px;height:30px;border-radius:50%;border:0;background:#ff5f57;color:rgba(0,0,0,.5);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.md-close:hover{background:#ff453a;color:#fff}
.md-body{padding:18px 20px;overflow-y:auto}
.md-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ── Room cards ── */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.room-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm);overflow:hidden}
.room-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--blue)}
.room-card:active{transform:scale(.97)}
.room-card .rc-grade{font-size:11px;color:var(--muted);font-weight:600}
.room-card .rc-no{font-family:'Kanit';font-weight:800;font-size:30px;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.room-card .rc-meta{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
.room-card .rc-bar{height:6px;border-radius:6px;background:var(--line);margin-top:9px;overflow:hidden}
.room-card .rc-bar i{display:block;height:100%;border-radius:6px;background:var(--grad);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.rc-dot{position:absolute;top:11px;right:11px;min-width:24px;height:24px;border-radius:99px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.rc-dot.red{background:linear-gradient(135deg,#ff453a,#ff3b30);animation:dotpulse 2s ease-in-out infinite}
.rc-dot.green{background:linear-gradient(135deg,#34c759,#30b350)}
.rc-dot.gray{background:#c7c7cc}
@keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ── Check-in page ── */
.ci-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.ci-tool{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 12px;border-radius:15px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
.ci-tool:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ci-tool:active{transform:scale(.96)}
.ci-tool .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;color:#fff}
.ci-tool b{font-family:'Kanit';font-size:13.5px}
.ci-tool small{font-size:11px;color:var(--muted)}
.ci-search{position:relative;margin-bottom:14px}
.ci-now{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:14px;background:linear-gradient(135deg,rgba(10,132,255,.08),rgba(94,92,230,.08));border:1px solid var(--line);margin-bottom:14px;font-size:13px}
.ci-now .t{font-family:'Kanit';font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;color:var(--blue)}
.ci-counts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.ci-count{text-align:center;padding:9px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ci-count .v{font-family:'Kanit';font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.ci-count .l{font-size:10px;color:var(--muted)}

/* roster list */
.roster{display:flex;flex-direction:column;gap:8px}
.rs-item{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:13px;transition:all .15s}
.rs-item:hover{box-shadow:var(--shadow-sm)}
.rs-item.checked{border-left:4px solid var(--green)}
.rs-no{width:30px;height:30px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink2);flex-shrink:0}
.rs-ava{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0;font-size:14px}
.rs-ava img{width:100%;height:100%;object-fit:cover}
.rs-main{flex:1;min-width:0}
.rs-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-meta{font-size:11px;color:var(--muted)}
.rs-actions{display:flex;gap:5px;flex-shrink:0}
.rs-st-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.rs-st-btn:hover{border-color:var(--blue);color:var(--blue)}
.rs-st-btn.active.present{background:var(--green);color:#fff;border-color:var(--green)}
.rs-st-btn.active.late{background:var(--orange);color:#fff;border-color:var(--orange)}
.rs-st-btn.active.absent{background:var(--red);color:#fff;border-color:var(--red)}
.rs-st-btn.active.leave{background:var(--purple);color:#fff;border-color:var(--purple)}

/* scanner */
.scan-box{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:280px}
#scan-reader{width:100%}
.scan-hint{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.scan-flash{position:fixed;inset:0;background:rgba(52,199,89,.4);z-index:300;pointer-events:none;opacity:0;animation:flash .4s ease}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
.scan-feed{display:flex;align-items:center;gap:11px;padding:12px;border-radius:13px;background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.3);margin-top:12px;animation:mIn .3s}
.scan-feed .ic{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.scan-feed.dup{background:rgba(255,159,10,.1);border-color:rgba(255,159,10,.3)}.scan-feed.dup .ic{background:var(--orange)}

/* ── Donut / charts (SVG) ── */
.chart-row{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:920px){.chart-row{grid-template-columns:1fr 1fr}}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.donut-legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.donut-legend .li{display:flex;align-items:center;gap:8px}
.donut-legend .dot{width:11px;height:11px;border-radius:3px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .bl{width:46px;font-size:12px;color:var(--ink2);font-weight:600}
.bar-track{flex:1;height:14px;border-radius:8px;background:var(--bg2);overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:var(--grad);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar-v{width:54px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ── Table ── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead th{background:var(--bg2);padding:10px 12px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted);text-transform:uppercase;position:sticky;top:0}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--line)}
.data-table tbody tr:hover{background:var(--bg2)}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}

/* segmented (macOS) */
.seg{display:inline-flex;background:#e9e9ed;border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:0;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:'Kanit'}
.seg button.on{background:#fff;color:var(--blue);box-shadow:var(--shadow-sm)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:#fff;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:160px}

/* image upload field */
.img-field{display:flex;align-items:center;gap:14px}
.img-prev{width:74px;height:74px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--muted);font-size:26px}
.img-prev img{width:100%;height:100%;object-fit:cover}

/* ── Bottom nav (mobile) ── */
.bottom-nav{display:none}
.app-fab{display:none}

@media(max-width:860px){
  .sidebar{position:fixed;left:-280px;top:0;height:100vh;width:262px;transition:left .28s cubic-bezier(.3,.9,.3,1);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .sidebar.open{left:0}
  .sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29;backdrop-filter:blur(2px)}
  .sb-backdrop.show{display:block}
  .tb-burger{display:flex;align-items:center;justify-content:center}
  .login-win{grid-template-columns:1fr;max-width:440px}
  .login-brand{display:none}
  .lf-mini{display:flex}
  .page-wrap{padding-bottom:88px}
  .app-footer{display:none}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:7px 6px;padding-bottom:calc(7px + env(safe-area-inset-bottom));justify-content:space-around}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;border:0;background:0;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;text-decoration:none}
  .bn-item i{font-size:21px}
  .bn-item.active{color:var(--blue)}
  .bn-item.active::before{content:'';position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--grad)}
}
.sb-backdrop{display:none}
@media(min-width:861px){.sb-backdrop{display:none!important}.bottom-nav{display:none!important}}
@media(max-width:540px){
  .login-form-wrap{padding:24px 20px}
  .ci-counts{grid-template-columns:repeat(5,1fr);gap:5px}
  .ci-count .v{font-size:16px}
  .modal-card{max-width:100%;border-radius:20px 20px 0 0;margin-top:auto;max-height:92vh}
  #modal-host{align-items:flex-end;padding:0}
  .hero-name{font-size:19px}
  .lf-demo-grid{grid-template-columns:1fr 1fr}
}

/* ── Print ── */
@media print{
  @page{size:A4 portrait;margin:14mm}
  .sidebar,.topbar,.bottom-nav,.app-footer,.sb-backdrop,#modal-host,#spin-host,#toast-host,.sd-no-print{display:none!important}
  body.print-on #app-root{display:none!important}
  .shell{display:block!important}.page-wrap{padding:0!important;max-width:100%!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel,.card{box-shadow:none!important;break-inside:avoid}
}
</style>

  function wireImageFields(root, folder) {

      'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
      'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js'

      function tryLoad(i) {
        if (typeof Html5Qrcode !== 'undefined') return resolve(Html5Qrcode);

        s.onerror = function () { tryLoad(i + 1); };
        document.head.appendChild(s);
      }
      tryLoad(0);
    });
    return __scanLib;
  }
  function stopScan() {
    if (__scanner) { try { __scanner.stop().then(function () { try { __scanner.clear(); } catch (e) {} __scanner = null; }).catch(function () { __scanner = null; }); } catch (e) { __scanner = null; } }
  }

  };
})();

    else parts.forEach(function (p) {

      segs += '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="' + p.color + '" stroke-width="20" stroke-dasharray="' + len + ' ' + (c - len) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 64 64)" stroke-linecap="butt"/>';
      off += len;
    });
    return '<svg viewBox="0 0 128 128" width="140" height="140" preserveAspectRatio="xMidYMid meet">' + segs
      + '<text x="64" y="60" text-anchor="middle" font-family="Kanit" font-weight="800" font-size="26" fill="#1d1d1f">' + esc(centerLabel) + '</text>'
      + '<text x="64" y="80" text-anchor="middle" font-family="Sarabun" font-size="11" fill="#86868b">' + esc(centerSub || '') + '</text></svg>';
