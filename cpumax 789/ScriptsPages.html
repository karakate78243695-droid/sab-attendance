<script type="text/x-sab-pages" id="sab-pages-script">
/* ═══════════════════════════════════════════════════════════════
   SAB · ScriptsPages.html — page routes (dashboard · rooms · checkin · students · reports · users · audit · settings · profile)
   Developer: ครูวิรัตน์ หาดคำ · www.kruwirat.com · v1.0.0
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var S = window.SAB, $ = S.$, $$ = S.$$, esc = S.esc, el = S.el, call = S.call, toast = S.toast;
  var Spinner = S.Spinner, Modal = S.Modal, runBtn = S.runBtn, TH = S.TH, hasCap = S.hasCap, confirmModal = S.confirmModal;
  var R = S.Routes;
  function page() { return $('#page'); }
  var STC = { present: '#34c759', late: '#ff9f0a', absent: '#ff3b30', leave: '#5e5ce6', unchecked: '#c7c7cc' };
  var STL = { present: 'มาแถว', late: 'มาสาย', absent: 'ขาดแถว', leave: 'ลา', unchecked: 'ยังไม่เช็ค' };
  var STI = { present: 'check-circle-fill', late: 'clock-fill', absent: 'x-circle-fill', leave: 'calendar2-check-fill' };

  function qparams(hash) { var q = {}; var i = (hash || '').indexOf('?'); if (i >= 0) hash.substring(i + 1).split('&').forEach(function (kv) { var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); }); return q; }
  function grade(room) { return 'ม.' + String(room).split('/')[0]; }
  function badge(st) { return st ? '<span class="badge b-' + st + '"><i class="bi bi-' + (STI[st] || 'circle') + '"></i> ' + STL[st] + '</span>' : '<span class="badge b-none">ยังไม่เช็ค</span>'; }

  /* ── SVG donut ── */
  function donut(parts, total, centerLabel, centerSub) {
    total = total || parts.reduce(function (a, p) { return a + p.value; }, 0);
    var r = 52, c = 2 * Math.PI * r, off = 0, segs = '';
    if (total <= 0) { segs = '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="#e8e8ed" stroke-width="20"/>'; }
    else parts.forEach(function (p) {
      if (p.value <= 0) return;
      var len = c * (p.value / total);
      segs += '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="' + p.color + '" stroke-width="20" stroke-dasharray="' + len + ' ' + (c - len) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 64 64)" stroke-linecap="butt"/>';
      off += len;
    });
    return '<svg viewBox="0 0 128 128" width="140" height="140" preserveAspectRatio="xMidYMid meet">' + segs
      + '<text x="64" y="60" text-anchor="middle" font-family="Kanit" font-weight="800" font-size="26" fill="#1d1d1f">' + esc(centerLabel) + '</text>'
      + '<text x="64" y="80" text-anchor="middle" font-family="Sarabun" font-size="11" fill="#86868b">' + esc(centerSub || '') + '</text></svg>';
  }
  function legend(parts, total) {
    total = total || parts.reduce(function (a, p) { return a + p.value; }, 0);
    return '<div class="donut-legend">' + parts.map(function (p) {
      var pct = total ? Math.round(p.value / total * 100) : 0;
      return '<div class="li"><span class="dot" style="background:' + p.color + '"></span> ' + esc(p.label) + ' <b style="margin-left:auto">' + p.value + '</b> <span style="color:#86868b">(' + pct + '%)</span></div>';
    }).join('') + '</div>';
  }
  function barRow(label, value, max, color) {
    var pct = max ? Math.round(value / max * 100) : 0;
    return '<div class="bar-row"><div class="bl">' + esc(label) + '</div><div class="bar-track"><div class="bar-fill" style="width:0%;background:' + (color || 'var(--grad)') + '" data-w="' + pct + '"></div></div><div class="bar-v">' + value + '</div></div>';
  }
  function animateBars(root) { setTimeout(function () { $$('.bar-fill', root || document).forEach(function (b) { b.style.width = (b.getAttribute('data-w') || 0) + '%'; }); }, 60); }
  function sk(h) { return '<div class="sk" style="height:' + h + 'px;border-radius:14px;margin-bottom:12px"></div>'; }

  /* ════════════ DASHBOARD ════════════ */
  R['#/dashboard'] = function () {
    var p = page(); var u = S.Store.user || {};
    var hr = new Date().getHours();
    var greet = hr < 12 ? 'อรุณสวัสดิ์' : hr < 17 ? 'สวัสดีตอนบ่าย' : 'สวัสดีตอนเย็น';
    p.innerHTML = sk(150) + sk(90) + sk(220);
    call('attendance.dashboard', {}).then(function (d) {
      if (!$('#page')) return;
      var t = d.today, totSt = t.present + t.late + t.absent + t.leave;
      var parts = [{ label: 'มาแถว', value: t.present, color: STC.present }, { label: 'มาสาย', value: t.late, color: STC.late }, { label: 'ขาดแถว', value: t.absent, color: STC.absent }, { label: 'ลา', value: t.leave, color: STC.leave }];
      var maxTrend = Math.max(1, Math.max.apply(null, d.trend.map(function (x) { return x.total; })));
      var trendBars = d.trend.map(function (x) {
        var dd = TH.parse(x.date); var lbl = dd ? (TH.WS[dd.getDay()] + ' ' + dd.getDate()) : x.date;
        return barRow(lbl, x.total, maxTrend, 'var(--grad)');
      }).join('');
      var roomQuick = d.rooms.slice(0, 15).map(function (r) {
        var done = r.total > 0 && r.remaining === 0;
        var dotCls = r.total === 0 ? 'gray' : (done ? 'green' : 'red');
        var dotInner = r.total === 0 ? '<i class="bi bi-dash"></i>' : (done ? '<i class="bi bi-check-lg"></i>' : r.remaining);
        return '<a class="room-card" href="#/checkin?room=' + encodeURIComponent(r.room) + '"><div class="rc-grade">' + grade(r.room) + '</div><div class="rc-no">' + esc(r.room) + '</div>'
          + '<div class="rc-meta"><i class="bi bi-people"></i> เช็ค ' + r.checked + '/' + r.total + '</div>'
          + '<div class="rc-bar"><i style="width:' + r.pct + '%"></i></div>'
          + '<span class="rc-dot ' + dotCls + '">' + dotInner + '</span></a>';
      }).join('');
      p.innerHTML = '<section class="hero"><div class="hero-top"><div class="hero-ava">' + S.avatarHtml(u) + '</div>'
        + '<div><div class="hero-greet">' + greet + '</div><div class="hero-name">' + esc(u.full_name || u.username) + '</div><div class="hero-sub"><i class="bi bi-calendar3"></i> ' + TH.dateFull(d.date) + '</div></div></div>'
        + '<div class="hero-stats">'
        + '<div class="hero-stat"><div class="hero-stat-v">' + d.total_students + '</div><div class="hero-stat-l">นักเรียนทั้งหมด</div></div>'
        + '<div class="hero-stat"><div class="hero-stat-v">' + d.checked_today + '</div><div class="hero-stat-l">เช็คแล้ววันนี้</div></div>'
        + '<div class="hero-stat"><div class="hero-stat-v">' + d.unchecked_today + '</div><div class="hero-stat-l">ยังไม่เช็ค</div></div>'
        + '<div class="hero-stat"><div class="hero-stat-v">' + d.rate + '%</div><div class="hero-stat-l">ความคืบหน้า</div></div>'
        + '</div></section>'
        + '<div class="stat-grid">'
        + statCard('check-circle-fill', t.present, 'มาแถว', STC.present)
        + statCard('clock-fill', t.late, 'มาสาย', STC.late)
        + statCard('x-circle-fill', t.absent, 'ขาดแถว', STC.absent)
        + statCard('calendar2-check-fill', t.leave, 'ลา', STC.leave)
        + '</div>'
        + '<div class="chart-row">'
        + '<div class="panel"><div class="panel-h"><i class="bi bi-pie-chart-fill"></i> สรุปสถานะวันนี้</div><div class="donut-wrap">' + donut(parts, totSt, String(totSt), 'รายการ') + legend(parts, totSt) + '</div></div>'
        + '<div class="panel"><div class="panel-h"><i class="bi bi-bar-chart-line-fill"></i> แนวโน้ม 7 วัน <span class="sub">จำนวนเช็คชื่อ</span></div>' + (trendBars || '<div class="empty"><i class="bi bi-graph-up"></i><p>ยังไม่มีข้อมูล</p></div>') + '</div>'
        + '</div>'
        + '<div class="panel"><div class="panel-h"><i class="bi bi-grid-3x3-gap-fill"></i> เช็คชื่อรายห้อง <span class="sub">แตะเพื่อเช็คชื่อ</span></div><div class="room-grid">' + roomQuick + '</div></div>';
      animateBars(p);
    }).catch(function (e) { if ($('#page')) p.innerHTML = errBox(e.message); });
  };
  function statCard(ic, v, l, color) {
    return '<div class="stat"><div class="stat-ic" style="background:' + color + '"><i class="bi bi-' + ic + '"></i></div><div class="stat-v">' + v + '</div><div class="stat-l">' + esc(l) + '</div></div>';
  }
  function errBox(m) { return '<div class="empty"><i class="bi bi-wifi-off"></i><p>' + esc(m) + '</p><button class="btn btn-ghost" data-action="retry" style="margin-top:10px"><i class="bi bi-arrow-clockwise"></i> ลองใหม่</button></div>'; }

  /* ════════════ ROOMS (เลือกห้อง) ════════════ */
  R['#/rooms'] = function () {
    var p = page();
    p.innerHTML = '<section class="hero" style="margin-bottom:16px"><div class="hero-top"><div class="hero-ava"><i class="bi bi-grid-3x3-gap-fill"></i></div><div><div class="hero-greet">เลือกห้องเรียนเพื่อเช็คชื่อ</div><div class="hero-name">เช็คชื่อหน้าเสาธง</div><div class="hero-sub" id="rm-date"></div></div></div></section>'
      + '<div class="toolbar"><div class="seg" id="rm-seg"></div><input type="date" class="input" id="rm-date-in" style="width:auto"></div>'
      + '<div id="rm-grid" class="room-grid">' + Array(15).join(sk(120)) + '</div>';
    var date = qparams(location.hash).date || todayStr();
    var di = $('#rm-date-in'); if (di) { di.value = date; di.addEventListener('change', function () { loadRooms(di.value); }); }
    loadRooms(date);
    function loadRooms(dt) {
      $('#rm-date').innerHTML = '<i class="bi bi-calendar3"></i> ' + TH.dateFull(dt);
      call('attendance.room_status', { date: dt }).then(function (d) {
        if (!$('#rm-grid')) return;
        var rooms = S.Store.boot.rooms || [];
        $('#rm-grid').innerHTML = rooms.map(function (room) {
          var st = d.rooms[room] || { total: 0, checked: 0, remaining: 0, done: false };
          var pct = st.total ? Math.round(st.checked / st.total * 100) : 0;
          var dotCls = st.total === 0 ? 'gray' : (st.done ? 'green' : 'red');
          var dotInner = st.total === 0 ? '<i class="bi bi-dash"></i>' : (st.done ? '<i class="bi bi-check-lg"></i>' : st.remaining);
          return '<a class="room-card" href="#/checkin?room=' + encodeURIComponent(room) + '&date=' + dt + '"><div class="rc-grade">' + grade(room) + '</div><div class="rc-no">' + esc(room) + '</div>'
            + '<div class="rc-meta"><i class="bi bi-people"></i> ' + st.checked + '/' + st.total + ' คน</div>'
            + '<div class="rc-bar"><i style="width:' + pct + '%"></i></div>'
            + '<span class="rc-dot ' + dotCls + '">' + dotInner + '</span></a>';
        }).join('');
      }).catch(function (e) { if ($('#rm-grid')) $('#rm-grid').innerHTML = errBox(e.message); });
    }
  };
  function todayStr() { var n = new Date(); return n.getFullYear() + '-' + TH.pad(n.getMonth() + 1) + '-' + TH.pad(n.getDate()); }

  /* ════════════ CHECK-IN ════════════ */
  var CK = { room: '', date: '', roster: [], lastScan: { code: '', t: 0 } };
  R['#/checkin'] = function (hash) {
    var q = qparams(hash);
    CK.room = q.room || ''; CK.date = q.date || todayStr();
    if (!CK.room) { location.hash = '#/rooms'; return; }
    var p = page();
    p.innerHTML = '<div class="toolbar"><a class="btn btn-ghost" href="#/rooms"><i class="bi bi-arrow-left"></i> ห้องอื่น</a>'
      + '<div class="tb-pill" style="font-size:14px"><i class="bi bi-door-open-fill"></i> ห้อง <b style="font-family:Kanit">' + esc(CK.room) + '</b></div>'
      + '<input type="date" class="input" id="ck-date" value="' + esc(CK.date) + '" style="width:auto;margin-left:auto"></div>'
      + '<div class="ci-now" id="ck-now"><i class="bi bi-clock"></i> เวลาขณะนี้ <span class="t" id="ck-time">--:--</span> · สถานะที่จะให้: <span id="ck-status"></span></div>'
      + '<div class="ci-tools">'
      + '<div class="ci-tool" data-ck="scan"><div class="ic" style="background:var(--grad)"><i class="bi bi-camera-fill"></i></div><b>สแกนกล้อง</b><small>เปิดกล้องสแกน</small></div>'
      + '<div class="ci-tool" data-ck="photo"><div class="ic" style="background:linear-gradient(135deg,#5e5ce6,#bf5af2)"><i class="bi bi-image-fill"></i></div><b>ถ่ายภาพ</b><small>สแกนจากรูป</small></div>'
      + '<div class="ci-tool" data-ck="manual"><div class="ic" style="background:linear-gradient(135deg,#34c759,#30b350)"><i class="bi bi-keyboard-fill"></i></div><b>พิมพ์รหัส</b><small>กรอกรหัสนักเรียน</small></div>'
      + '</div>'
      + '<div class="ci-search"><div class="input-wrap"><i class="iw-ic bi bi-search"></i><input class="input" id="ck-search" placeholder="ค้นหาชื่อ / เลขที่ / รหัส แล้วกด Enter เพื่อเช็ค" inputmode="text"></div></div>'
      + '<div class="ci-counts" id="ck-counts"></div>'
      + '<div class="panel"><div class="panel-h"><i class="bi bi-list-check"></i> รายชื่อนักเรียน <span class="sub" id="ck-room-info"></span></div><div class="roster" id="ck-roster">' + sk(56) + sk(56) + sk(56) + '</div></div>';
    var di = $('#ck-date'); if (di) di.addEventListener('change', function () { CK.date = di.value; loadRoster(); });
    var sch = $('#ck-search');
    if (sch) {
      sch.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); var v = sch.value.trim(); if (v) checkByCode(v, 'manual'); } });
      sch.addEventListener('input', function () { filterRoster(sch.value.trim()); });
    }
    $$('.ci-tool', p).forEach(function (tool) {
      tool.addEventListener('click', function () {
        var m = tool.getAttribute('data-ck');
        if (m === 'scan') openScanLive();
        else if (m === 'photo') openScanPhoto();
        else if (m === 'manual') { var s = $('#ck-search'); if (s) s.focus(); }
      });
    });
    tickStatus(); if (window.__ckTick) clearInterval(window.__ckTick); window.__ckTick = setInterval(tickStatus, 1000);
    loadRoster();
  };
  function tickStatus() {
    var now = new Date(); var t = TH.pad(now.getHours()) + ':' + TH.pad(now.getMinutes());
    var te = $('#ck-time'); if (!te) { if (window.__ckTick) { clearInterval(window.__ckTick); window.__ckTick = null; } return; }
    te.textContent = t;
    var s = (S.Store.boot.settings) || {};
    var mNow = parseInt(t.split(':')[0]) * 60 + parseInt(t.split(':')[1]);
    function mm(x) { var p = String(x || '').split(':'); return parseInt(p[0]) * 60 + parseInt(p[1] || 0); }
    var st = mNow <= mm(s.present_end || '08:30') ? 'present' : mNow <= mm(s.late_end || '08:40') ? 'late' : 'absent';
    var cs = $('#ck-status'); if (cs) cs.innerHTML = badge(st);
  }
  function loadRoster() {
    var rEl = $('#ck-roster'); if (rEl) rEl.innerHTML = sk(56) + sk(56) + sk(56);
    call('attendance.roster', { room: CK.room, date: CK.date }).then(function (d) {
      if (!$('#ck-roster')) return;
      CK.roster = d.roster;
      $('#ck-room-info').textContent = TH.date(d.date) + ' · ' + d.total + ' คน';
      renderCounts(d.counts, d.total);
      renderRoster(d.roster);
    }).catch(function (e) { if ($('#ck-roster')) $('#ck-roster').innerHTML = errBox(e.message); });
  }
  function renderCounts(c, total) {
    var ce = $('#ck-counts'); if (!ce) return;
    var items = [['present', c.present || 0], ['late', c.late || 0], ['absent', c.absent || 0], ['leave', c.leave || 0], ['unchecked', c.unchecked || 0]];
    ce.innerHTML = items.map(function (it) { return '<div class="ci-count"><div class="v" style="color:' + STC[it[0]] + '">' + it[1] + '</div><div class="l">' + STL[it[0]] + '</div></div>'; }).join('');
  }
  function renderRoster(roster) {
    var rEl = $('#ck-roster'); if (!rEl) return;
    if (!roster.length) { rEl.innerHTML = '<div class="empty"><i class="bi bi-people"></i><p>ยังไม่มีนักเรียนในห้องนี้</p></div>'; return; }
    rEl.innerHTML = roster.map(function (s) {
      var ava = s.photo_url ? '<img src="' + esc(s.photo_url) + '" referrerpolicy="no-referrer">' : esc((s.name || '?').charAt(0));
      var btns = ['present', 'late', 'absent', 'leave'].map(function (st) {
        return '<button class="rs-st-btn ' + (s.status === st ? 'active ' + st : '') + '" data-set="' + st + '" data-sid="' + esc(s.student_id) + '" title="' + STL[st] + '"><i class="bi bi-' + STI[st] + '"></i></button>';
      }).join('');
      return '<div class="rs-item ' + (s.checked ? 'checked' : '') + '" data-sid="' + esc(s.student_id) + '"><div class="rs-no">' + s.number + '</div><div class="rs-ava">' + ava + '</div>'
        + '<div class="rs-main"><div class="rs-name">' + esc(s.name) + '</div><div class="rs-meta">รหัส ' + esc(s.student_id) + (s.time ? ' · ' + esc(s.time) + ' น.' : '') + '</div></div>'
        + '<div class="rs-actions">' + btns + '</div></div>';
    }).join('');
    $$('.rs-st-btn', rEl).forEach(function (b) {
      b.addEventListener('click', function () { setStatus(b.getAttribute('data-sid'), b.getAttribute('data-set'), b); });
    });
  }
  function filterRoster(q) {
    q = (q || '').toLowerCase();
    $$('.rs-item', $('#ck-roster')).forEach(function (it) {
      var txt = it.textContent.toLowerCase();
      it.style.display = (!q || txt.indexOf(q) >= 0) ? '' : 'none';
    });
  }
  function checkByCode(code, method) {
    call('attendance.check', { room: CK.room, date: CK.date, code: code, method: method }).then(function (r) {
      scanFeedback(r);
      var s = $('#ck-search'); if (s && method === 'manual') s.value = '';
      loadRoster();
    }).catch(function (e) { toast(e.message, 'error'); beep(false); });
  }
  function setStatus(sid, st, btn) {
    call('attendance.set_status', { room: CK.room, date: CK.date, student_id: sid, status: st }).then(function () {
      toast('บันทึก: ' + STL[st], 'success', 1500);
      loadRoster();
    }).catch(function (e) { toast(e.message, 'error'); });
  }
  function scanFeedback(r) {
    beep(true);
    var s = (S.Store.boot.settings) || {};
    if (String(s.scan_vibrate || 'yes') === 'yes' && navigator.vibrate) navigator.vibrate(r.duplicate ? [40, 40, 40] : 60);
    var flash = el('<div class="scan-flash"></div>'); document.body.appendChild(flash); setTimeout(function () { flash.remove(); }, 420);
    toast((r.duplicate ? 'อัปเดต: ' : '✓ ') + r.student.name + ' · ' + r.status_label + ' (' + r.time + ')', r.duplicate ? 'warning' : 'success', 2200);
    var host = $('#scan-feed-host');
    if (host) {
      var ava = r.student.photo_url ? '<img src="' + esc(r.student.photo_url) + '" referrerpolicy="no-referrer">' : '<i class="bi bi-check-lg"></i>';
      host.innerHTML = '<div class="scan-feed ' + (r.duplicate ? 'dup' : '') + '"><div class="ic">' + ava + '</div><div><div style="font-weight:600">' + esc(r.student.name) + '</div><div style="font-size:12px;color:#86868b">' + r.status_label + ' · ' + r.time + ' น.</div></div></div>' + host.innerHTML;
    }
  }
  function beep(ok) {
    var s = (S.Store.boot.settings) || {};
    if (String(s.scan_sound || 'yes') !== 'yes') return;
    try { var ac = new (window.AudioContext || window.webkitAudioContext)(); var o = ac.createOscillator(); var g = ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value = ok ? 880 : 280; g.gain.value = 0.08; o.start(); setTimeout(function () { o.stop(); ac.close(); }, ok ? 120 : 220); } catch (e) {}
  }

  /* ── scanner modals ── */
  function scanFormats() {
    if (typeof Html5QrcodeSupportedFormats === 'undefined') return undefined;
    var F = Html5QrcodeSupportedFormats;
    return [F.CODE_128, F.CODE_39, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.QR_CODE, F.CODABAR, F.ITF].filter(function (x) { return x != null; });
  }
  function openScanLive() {
    Modal.open({
      title: 'สแกนบาร์โค้ด · ห้อง ' + CK.room, icon: 'camera-fill', large: false,
      html: '<div class="scan-box"><div id="scan-reader"></div></div><div class="scan-hint"><i class="bi bi-upc-scan"></i> เล็งกล้องไปที่บาร์โค้ดบนบัตรนักเรียน</div>'
        + '<div class="ci-search" style="margin:12px 0 0"><div class="input-wrap"><i class="iw-ic bi bi-keyboard"></i><input class="input" id="scan-manual" placeholder="หรือพิมพ์รหัสนักเรียนแล้วกด Enter" inputmode="text"></div></div>'
        + '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-ghost btn-block" id="scan-to-photo"><i class="bi bi-image"></i> ถ่ายภาพแทน</button></div>'
        + '<div id="scan-feed-host"></div>',
      footer: '<button class="btn btn-ghost" data-modal-close>ปิด</button>'
    });
    var sm = $('#scan-manual'); if (sm) { setTimeout(function () { try { sm.focus(); } catch (e) {} }, 200); sm.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); var v = sm.value.trim(); if (v) { checkByCode(v, 'manual'); sm.value = ''; } } }); }
    var sp = $('#scan-to-photo'); if (sp) sp.addEventListener('click', function () { Modal.close(); S.stopScan(); openScanPhoto(); });
    Spinner.show('กำลังเปิดกล้อง', { stages: ['โหลดไลบรารี…', 'ขออนุญาตกล้อง…'] });

    function mapRow(r) {

        + (valid.length > 8 ? '<tr><td colspan="4" style="text-align:center;color:#86868b">… และอีก ' + (valid.length - 8) + ' รายการ</td></tr>' : '') + '</tbody></table></div>';

        }).catch(function (e) { toast(e.message, 'error'); });
      };
    }
  };
