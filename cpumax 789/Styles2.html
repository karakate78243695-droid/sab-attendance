<style>
/* ═══════════════════════════════════════════════════════════════
   SAB · Styles2.html — login · modal · room cards · scanner · dashboard · responsive · print
   ═══════════════════════════════════════════════════════════════ */

/* ── Login (macOS window) ── */
.login-stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 80% -10%,rgba(94,92,230,.16),transparent),radial-gradient(900px 500px at 0% 100%,rgba(10,132,255,.16),transparent),linear-gradient(160deg,#eef1f6,#f5f5f7)}
.login-win{width:100%;max-width:960px;background:rgba(255,255,255,.78);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.6);border-radius:22px;box-shadow:0 40px 90px rgba(0,0,0,.22);overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr;animation:winIn .5s cubic-bezier(.2,.9,.3,1.05)}
@keyframes winIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.login-bar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.4)}
.login-bar span{width:12px;height:12px;border-radius:50%}
.login-bar span:nth-child(1){background:#ff5f57}.login-bar span:nth-child(2){background:#febc2e}.login-bar span:nth-child(3){background:#28c840}
.login-bar .lb-t{margin-left:8px;font-size:12px;color:var(--muted);font-family:'Kanit';width:auto;height:auto;border-radius:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:14px}
.login-brand{padding:34px 32px;background:var(--grad);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.login-brand::before{content:'';position:absolute;top:-30%;right:-20%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 60%);pointer-events:none;animation:float1 14s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-16px,14px)}}
.lb-logo{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:18px;border:2px solid rgba(255,255,255,.3);position:relative;z-index:1}
.lb-tag{font-family:'Kanit';font-weight:800;font-size:27px;line-height:1.2;position:relative;z-index:1}
.lb-sub{font-size:13.5px;opacity:.92;margin-top:8px;line-height:1.6;position:relative;z-index:1}
.lb-feats{margin-top:24px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.lb-feat{display:flex;align-items:center;gap:11px;font-size:13px}
.lb-feat i{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.lb-feat b{display:block;font-family:'Kanit';font-weight:600;font-size:13.5px}
.lb-feat small{opacity:.85;font-size:11.5px}
.login-form-wrap{padding:34px 32px;display:flex;flex-direction:column;justify-content:center}
.lf-mini{display:none;align-items:center;gap:10px;margin-bottom:18px}
.lf-mini .mi-logo{width:44px;height:44px;border-radius:13px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px}
.lf-title{font-family:'Kanit';font-weight:800;font-size:23px}
.lf-desc{font-size:13px;color:var(--muted);margin:3px 0 20px}
.lf-toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:0;border:0;color:var(--muted);cursor:pointer;font-size:16px}
.lf-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px;font-size:12.5px}
.lf-check{display:flex;align-items:center;gap:7px;color:var(--ink2);cursor:pointer}
.lf-forgot{color:var(--blue);cursor:pointer}
.lf-submit{width:100%;height:50px;position:relative;overflow:hidden;display:block}
.lf-submit-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;visibility:hidden;transition:opacity .25s}
.lf-submit-state.on{opacity:1;visibility:visible}
.lf-foot-links{margin-top:18px;text-align:center;display:flex;flex-direction:column;gap:10px}
.lf-manual-btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:9px;border:1px solid var(--line2);border-radius:11px;background:#fff;font-size:13px;color:var(--ink2);cursor:pointer;font-family:'Kanit';font-weight:600}
.lf-manual-btn:hover{border-color:var(--blue);color:var(--blue)}

/* demo cards */
.lf-demo{margin-top:18px;border:1px dashed rgba(10,132,255,.3);border-radius:14px;padding:12px;background:rgba(10,132,255,.04)}
.lf-demo-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:10px}
.lf-demo-pill{margin-left:auto;padding:2px 8px;border-radius:99px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f;font-size:10px;font-weight:700}
.lf-demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lf-demo-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 6px;background:#fff;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:all .18s;position:relative}
.lf-demo-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--blue)}
.lf-demo-card:active{transform:scale(.96)}
.lf-demo-card.loading{opacity:.6;pointer-events:none}
.lf-demo-ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.lf-demo-card[data-role="admin"] .lf-demo-ic{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#78350f}
.lf-demo-card[data-role="teacher"] .lf-demo-ic{background:linear-gradient(135deg,#a7f3d0,#34d399);color:#065f46}
.lf-demo-role{font-size:11.5px;font-weight:700}
.lf-demo-user{font-size:10px;color:var(--muted);font-family:monospace}
.lf-demo-note{font-size:11px;color:var(--muted);text-align:center;margin-top:9px}

/* ── Footer ── */
.app-footer{margin:16px 22px;padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px;color:var(--ink2);position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.app-footer::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
.af-year{background:var(--grad);color:#fff;padding:3px 10px;border-radius:99px;font-weight:800;font-variant-numeric:tabular-nums;font-family:'Kanit'}
.af-dev{display:flex;align-items:center;gap:11px}
.af-dev-link{position:relative;display:block;transition:transform .2s}
.af-dev-link:hover{transform:scale(1.08)}
.af-dev-logo{width:40px;height:40px;border-radius:50%;border:2px solid #fff;object-fit:cover;box-shadow:0 4px 12px rgba(10,132,255,.25)}
.af-dev-name{font-weight:700;font-family:'Kanit'}
.af-dev a{color:var(--blue)}

/* ── Modal (macOS sheet) ── */
#modal-host{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.32);backdrop-filter:blur(6px)}
#modal-host.is-open{display:flex}
.modal-card{width:100%;max-width:540px;max-height:90vh;background:var(--card);border-radius:20px;box-shadow:0 40px 90px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;animation:mIn .3s cubic-bezier(.2,.9,.3,1.05)}
.modal-card.lg{max-width:820px}
@keyframes mIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.md-head{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);position:relative}
.md-head .md-ic{width:36px;height:36px;border-radius:11px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.md-title{font-family:'Kanit';font-weight:700;font-size:16px;flex:1}
.md-close{width:30px;height:30px;border-radius:50%;border:0;background:#ff5f57;color:rgba(0,0,0,.5);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.md-close:hover{background:#ff453a;color:#fff}
.md-body{padding:18px 20px;overflow-y:auto}
.md-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ── Room cards ── */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.room-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm);overflow:hidden}
.room-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--blue)}
.room-card:active{transform:scale(.97)}
.room-card .rc-grade{font-size:11px;color:var(--muted);font-weight:600}
.room-card .rc-no{font-family:'Kanit';font-weight:800;font-size:30px;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.room-card .rc-meta{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
.room-card .rc-bar{height:6px;border-radius:6px;background:var(--line);margin-top:9px;overflow:hidden}
.room-card .rc-bar i{display:block;height:100%;border-radius:6px;background:var(--grad);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.rc-dot{position:absolute;top:11px;right:11px;min-width:24px;height:24px;border-radius:99px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.rc-dot.red{background:linear-gradient(135deg,#ff453a,#ff3b30);animation:dotpulse 2s ease-in-out infinite}
.rc-dot.green{background:linear-gradient(135deg,#34c759,#30b350)}
.rc-dot.gray{background:#c7c7cc}
@keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ── Check-in page ── */
.ci-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.ci-tool{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 12px;border-radius:15px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
.ci-tool:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ci-tool:active{transform:scale(.96)}
.ci-tool .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;color:#fff}
.ci-tool b{font-family:'Kanit';font-size:13.5px}
.ci-tool small{font-size:11px;color:var(--muted)}
.ci-search{position:relative;margin-bottom:14px}
.ci-now{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:14px;background:linear-gradient(135deg,rgba(10,132,255,.08),rgba(94,92,230,.08));border:1px solid var(--line);margin-bottom:14px;font-size:13px}
.ci-now .t{font-family:'Kanit';font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;color:var(--blue)}
.ci-counts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.ci-count{text-align:center;padding:9px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ci-count .v{font-family:'Kanit';font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.ci-count .l{font-size:10px;color:var(--muted)}

/* roster list */
.roster{display:flex;flex-direction:column;gap:8px}
.rs-item{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:13px;transition:all .15s}
.rs-item:hover{box-shadow:var(--shadow-sm)}
.rs-item.checked{border-left:4px solid var(--green)}
.rs-no{width:30px;height:30px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink2);flex-shrink:0}
.rs-ava{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0;font-size:14px}
.rs-ava img{width:100%;height:100%;object-fit:cover}
.rs-main{flex:1;min-width:0}
.rs-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-meta{font-size:11px;color:var(--muted)}
.rs-actions{display:flex;gap:5px;flex-shrink:0}
.rs-st-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.rs-st-btn:hover{border-color:var(--blue);color:var(--blue)}
.rs-st-btn.active.present{background:var(--green);color:#fff;border-color:var(--green)}
.rs-st-btn.active.late{background:var(--orange);color:#fff;border-color:var(--orange)}
.rs-st-btn.active.absent{background:var(--red);color:#fff;border-color:var(--red)}
.rs-st-btn.active.leave{background:var(--purple);color:#fff;border-color:var(--purple)}

/* scanner */
.scan-box{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:280px}
#scan-reader{width:100%}
.scan-hint{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.scan-flash{position:fixed;inset:0;background:rgba(52,199,89,.4);z-index:300;pointer-events:none;opacity:0;animation:flash .4s ease}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
.scan-feed{display:flex;align-items:center;gap:11px;padding:12px;border-radius:13px;background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.3);margin-top:12px;animation:mIn .3s}
.scan-feed .ic{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.scan-feed.dup{background:rgba(255,159,10,.1);border-color:rgba(255,159,10,.3)}.scan-feed.dup .ic{background:var(--orange)}

/* ── Donut / charts (SVG) ── */
.chart-row{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:920px){.chart-row{grid-template-columns:1fr 1fr}}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.donut-legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.donut-legend .li{display:flex;align-items:center;gap:8px}
.donut-legend .dot{width:11px;height:11px;border-radius:3px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .bl{width:46px;font-size:12px;color:var(--ink2);font-weight:600}
.bar-track{flex:1;height:14px;border-radius:8px;background:var(--bg2);overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:var(--grad);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar-v{width:54px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ── Table ── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead th{background:var(--bg2);padding:10px 12px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted);text-transform:uppercase;position:sticky;top:0}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--line)}
.data-table tbody tr:hover{background:var(--bg2)}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}

/* segmented (macOS) */
.seg{display:inline-flex;background:#e9e9ed;border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:0;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:'Kanit'}
.seg button.on{background:#fff;color:var(--blue);box-shadow:var(--shadow-sm)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:#fff;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:160px}

/* image upload field */
.img-field{display:flex;align-items:center;gap:14px}
.img-prev{width:74px;height:74px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--muted);font-size:26px}
.img-prev img{width:100%;height:100%;object-fit:cover}

/* ── Bottom nav (mobile) ── */
.bottom-nav{display:none}
.app-fab{display:none}

@media(max-width:860px){
  .sidebar{position:fixed;left:-280px;top:0;height:100vh;width:262px;transition:left .28s cubic-bezier(.3,.9,.3,1);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .sidebar.open{left:0}
  .sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29;backdrop-filter:blur(2px)}
  .sb-backdrop.show{display:block}
  .tb-burger{display:flex;align-items:center;justify-content:center}
  .login-win{grid-template-columns:1fr;max-width:440px}
  .login-brand{display:none}
  .lf-mini{display:flex}
  .page-wrap{padding-bottom:88px}
  .app-footer{display:none}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:7px 6px;padding-bottom:calc(7px + env(safe-area-inset-bottom));justify-content:space-around}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;border:0;background:0;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;text-decoration:none}
  .bn-item i{font-size:21px}
  .bn-item.active{color:var(--blue)}
  .bn-item.active::before{content:'';position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--grad)}
}
.sb-backdrop{display:none}
@media(min-width:861px){.sb-backdrop{display:none!important}.bottom-nav{display:none!important}}
@media(max-width:540px){
  .login-form-wrap{padding:24px 20px}
  .ci-counts{grid-template-columns:repeat(5,1fr);gap:5px}
  .ci-count .v{font-size:16px}
  .modal-card{max-width:100%;border-radius:20px 20px 0 0;margin-top:auto;max-height:92vh}
  #modal-host{align-items:flex-end;padding:0}
  .hero-name{font-size:19px}
  .lf-demo-grid{grid-template-columns:1fr 1fr}
}

/* ── Print ── */
@media print{
  @page{size:A4 portrait;margin:14mm}
  .sidebar,.topbar,.bottom-nav,.app-footer,.sb-backdrop,#modal-host,#spin-host,#toast-host,.sd-no-print{display:none!important}
  body.print-on #app-root{display:none!important}
  .shell{display:block!important}.page-wrap{padding:0!important;max-width:100%!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel,.card{box-shadow:none!important;break-inside:avoid}
}
</style>
