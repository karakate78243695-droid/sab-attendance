<style>
/* ═══════════════════════════════════════════════════════════════
   SAB · Styles.html — macOS theme · base · shell · components
   ═══════════════════════════════════════════════════════════════ */
:root{
  --blue:#0a84ff; --blue2:#5e5ce6; --blue-d:#0060df;
  --indigo:#5e5ce6; --grad:linear-gradient(135deg,#0a84ff,#5e5ce6);
  --green:#34c759; --orange:#ff9f0a; --red:#ff3b30; --purple:#5e5ce6; --pink:#ff2d92; --teal:#30c8c9;
  --bg:#ecedf1; --bg2:#f5f5f7; --card:#ffffff; --card2:#fbfbfd;
  --ink:#1d1d1f; --ink2:#3a3a3c; --muted:#86868b; --line:#e3e3e8; --line2:#d2d2d7;
  --sidebar:rgba(245,245,247,.72); --shadow:0 10px 40px rgba(0,0,0,.12); --shadow-sm:0 2px 10px rgba(0,0,0,.06);
  --radius:18px; --radius-sm:12px;
}
[data-theme="blue"]{--blue:#0a84ff;--blue2:#5e5ce6;--blue-d:#0060df;--grad:linear-gradient(135deg,#0a84ff,#5e5ce6)}
[data-theme="green"]{--blue:#34c759;--blue2:#30c8c9;--blue-d:#248a3d;--grad:linear-gradient(135deg,#34c759,#30c8c9)}
[data-theme="purple"]{--blue:#5e5ce6;--blue2:#bf5af2;--blue-d:#3634a3;--grad:linear-gradient(135deg,#5e5ce6,#bf5af2)}
[data-theme="orange"]{--blue:#ff9500;--blue2:#ff375f;--blue-d:#c93400;--grad:linear-gradient(135deg,#ff9500,#ff375f)}
[data-theme="pink"]{--blue:#ff2d92;--blue2:#ff375f;--blue-d:#c70063;--grad:linear-gradient(135deg,#ff2d92,#ff6482)}
[data-theme="graphite"]{--blue:#48484a;--blue2:#8e8e93;--blue-d:#2c2c2e;--grad:linear-gradient(135deg,#48484a,#8e8e93)}

*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body.sab-doc{font-family:'Sarabun','Kanit',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-weight:400}
h1,h2,h3,h4,h5,h6,.font-display,button,.btn,.nav-title{font-family:'Kanit','Sarabun',system-ui,sans-serif}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::selection{background:rgba(10,132,255,.18)}

/* ── Boot loader ── */
.boot-loader{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef1f6,#f5f5f7)}
.boot-loader[hidden]{display:none!important}
.boot-card{display:flex;flex-direction:column;align-items:center;gap:14px}
.boot-ring{position:relative;display:flex;align-items:center;justify-content:center;width:84px;height:84px}
.boot-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid rgba(10,132,255,.16);border-top-color:var(--blue);animation:spin 1s linear infinite}
.boot-ring i{font-size:34px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.boot-name{font-family:'Kanit';font-weight:700;font-size:18px;color:var(--ink)}
.boot-text{font-size:13px;color:var(--muted)}
.boot-dots{display:flex;gap:6px}.boot-dots span{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:bdot 1.2s ease-in-out infinite}
.boot-dots span:nth-child(2){animation-delay:.2s}.boot-dots span:nth-child(3){animation-delay:.4s}
@keyframes bdot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Spinner overlay ── */
.spin-overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(245,245,247,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.spin-overlay[hidden]{display:none!important}
.spin-card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:22px;padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow);min-width:230px}
.spin-q{position:relative;width:64px;height:64px}
.spin-q::before,.spin-q::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid transparent}
.spin-q::before{border-top-color:var(--blue);border-right-color:var(--blue2);animation:spin 1.1s linear infinite}
.spin-q::after{inset:9px;border-bottom-color:var(--blue2);animation:spin 1.5s linear infinite reverse}
.spin-q i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--blue)}
.spin-msg{font-family:'Kanit';font-weight:600;font-size:14px;color:var(--ink)}
.spin-sub{font-size:12px;color:var(--muted);min-height:16px}
.spin-bar{width:160px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.spin-bar::after{content:'';display:block;width:40%;height:100%;background:var(--grad);border-radius:4px;animation:sweep 1.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

/* ── Shell (macOS window) ── */
#app-root{min-height:100vh}
.shell{display:flex;align-items:stretch;min-height:100vh;width:100%}
.sidebar{flex:0 0 256px;width:256px;background:var(--sidebar);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:30}
.sb-traffic{display:flex;gap:8px;padding:16px 18px 6px}
.sb-traffic span{width:12px;height:12px;border-radius:50%}
.sb-traffic span:nth-child(1){background:#ff5f57}.sb-traffic span:nth-child(2){background:#febc2e}.sb-traffic span:nth-child(3){background:#28c840}
.sb-brand{display:flex;align-items:center;gap:11px;padding:6px 18px 16px;border-bottom:1px solid var(--line)}
.sb-logo{width:42px;height:42px;border-radius:13px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 6px 16px rgba(10,132,255,.3)}
.sb-brand-t{font-family:'Kanit';font-weight:700;font-size:14px;line-height:1.2}
.sb-brand-s{font-size:11px;color:var(--muted)}
.sb-clock{margin:12px 14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line);text-align:center}
.sb-clock-time{font-family:'Kanit';font-weight:700;font-size:24px;letter-spacing:.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.sb-clock-date{font-size:11px;color:var(--muted);margin-top:2px}
.sb-nav{flex:1;padding:6px 12px;overflow-y:auto}
.sb-cat{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 5px;display:flex;align-items:center;gap:6px}
.sb-cat::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--blue)}
.sb-link{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--ink2);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;position:relative;transition:all .18s}
.sb-link i{font-size:17px;width:20px;text-align:center;color:var(--muted)}
.sb-link:hover{background:rgba(0,0,0,.045)}
.sb-link.active{background:#fff;color:var(--blue);box-shadow:var(--shadow-sm);font-weight:600}
.sb-link.active i{color:var(--blue)}
.sb-link.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--grad)}
.sb-link.is-logout{color:var(--red)}.sb-link.is-logout i{color:var(--red)}
.sb-user{margin:10px 14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sb-ava{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden;flex-shrink:0}
.sb-ava img{width:100%;height:100%;object-fit:cover}
.sb-user-n{font-size:12.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;margin-top:3px}
.role-chip-admin{background:linear-gradient(135deg,#fde68a,#fbbf24);color:#78350f}
.role-chip-teacher{background:linear-gradient(135deg,#a7f3d0,#34d399);color:#065f46}

.main-area{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:12px;padding:12px 22px;background:rgba(245,245,247,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.tb-burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:18px;cursor:pointer}
.tb-title{font-family:'Kanit';font-weight:700;font-size:17px;flex:1;min-width:0;display:flex;align-items:center;gap:9px}
.tb-title .tb-ic{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.tb-title small{display:block;font-size:11px;color:var(--muted);font-weight:400;font-family:'Sarabun'}
.tb-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--ink2)}
.tb-pill .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,199,89,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}70%{box-shadow:0 0 0 8px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
.tb-prof{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;overflow:hidden;border:2px solid #fff;box-shadow:var(--shadow-sm)}
.tb-prof img{width:100%;height:100%;object-fit:cover}
.page-wrap{flex:1;padding:22px;max-width:1180px;width:100%;margin:0 auto}

/* profile popover */
.prof-pop{display:none;position:absolute;top:54px;right:18px;width:250px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:60;overflow:hidden;animation:popIn .18s ease}
.prof-pop.show{display:block}
@keyframes popIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.pp-head{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.pp-item{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:13px;color:var(--ink2);cursor:pointer}
.pp-item:hover{background:rgba(0,0,0,.04)}.pp-item i{font-size:16px;width:18px}
.pp-item.danger{color:var(--red)}.pp-divider{height:1px;background:var(--line)}

/* ── Buttons (multi-state) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .18s;font-family:'Kanit';position:relative;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(10,132,255,.28)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(10,132,255,.34)}
.btn-ghost{background:#fff;border-color:var(--line2);color:var(--ink2)}
.btn-ghost:hover{background:var(--bg2);border-color:var(--blue)}
.btn-danger{background:linear-gradient(135deg,#ff453a,#ff3b30);color:#fff;box-shadow:0 6px 16px rgba(255,59,48,.26)}
.btn-soft{background:rgba(10,132,255,.1);color:var(--blue)}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:13px}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn[data-state="loading"]{pointer-events:none}
.btn[data-state="loading"],.btn[data-state="success"],.btn[data-state="error"]{opacity:1!important}
.btn[data-state="success"]{background:linear-gradient(135deg,#34c759,#30b350)!important;color:#fff!important}
.btn[data-state="error"]{background:linear-gradient(135deg,#ff453a,#ff3b30)!important;color:#fff!important}
.spin-inline{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
.btn-icon{width:38px;height:38px;padding:0;border-radius:11px}

/* ── Cards / surfaces ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;margin-bottom:16px}
.panel-h{display:flex;align-items:center;gap:9px;font-family:'Kanit';font-weight:700;font-size:15px;margin-bottom:14px}
.panel-h i{color:var(--blue)}
.panel-h .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto}

/* ── Hero ── */
.hero{position:relative;overflow:hidden;border-radius:var(--radius);padding:22px 24px;color:#fff;background:var(--grad);box-shadow:0 14px 36px rgba(10,132,255,.28);margin-bottom:18px}
.hero::before{content:'';position:absolute;top:-50%;right:-8%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 62%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-60%;left:10%;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 62%);pointer-events:none}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.hero-ava{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
.hero-ava img{width:100%;height:100%;object-fit:cover}
.hero-greet{font-size:13px;opacity:.92}
.hero-name{font-family:'Kanit';font-weight:800;font-size:22px;line-height:1.15}
.hero-sub{font-size:12.5px;opacity:.88;margin-top:2px}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px;position:relative;z-index:1}
.hero-stat{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px}
.hero-stat-v{font-family:'Kanit';font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.hero-stat-l{font-size:11px;opacity:.9}

/* ── Stat cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .2s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.stat-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;margin-bottom:9px}
.stat-v{font-family:'Kanit';font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.stat-l{font-size:12px;color:var(--muted);margin-top:3px}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.b-present{background:rgba(52,199,89,.15);color:#1a7f37}
.b-late{background:rgba(255,159,10,.16);color:#9a6700}
.b-absent{background:rgba(255,59,48,.14);color:#c0271e}
.b-leave{background:rgba(94,92,230,.14);color:#3634a3}
.b-none{background:#f0f0f3;color:var(--muted)}

/* ── Forms ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field label .req{color:var(--red)}
.input,.select,.textarea{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:11px;font-size:14px;font-family:'Sarabun';background:#fff;color:var(--ink);transition:all .18s;box-sizing:border-box}
.input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(10,132,255,.13)}
.textarea{min-height:80px;resize:vertical}
.field-hint{font-size:11px;color:var(--muted);margin-top:5px}
.field.has-error .input,.field.has-error .select{border-color:var(--red);background:#fff5f5}
.field-error{font-size:11.5px;color:var(--red);margin-top:5px;display:flex;align-items:center;gap:5px}
.input-wrap{position:relative}
.input-wrap .iw-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.input-wrap .input{padding-left:40px}

/* ── empty / skeleton ── */
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty i{font-size:46px;color:var(--line2);display:block;margin-bottom:12px}
.empty p{font-size:14px;margin:0 0 4px}
.sk{background:linear-gradient(90deg,#eef0f3 0%,#f6f7f9 50%,#eef0f3 100%);background-size:200% 100%;animation:sk 1.5s ease-in-out infinite;border-radius:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Toast (custom + Swal theme) ── */
.swal2-popup{font-family:'Kanit','Sarabun',sans-serif!important;border-radius:20px!important}
.swal2-title{font-family:'Kanit'!important;font-weight:700!important;font-size:19px!important}
.swal2-styled.swal2-confirm{background:var(--grad)!important;border-radius:11px!important;box-shadow:0 6px 16px rgba(10,132,255,.3)!important}
.swal2-styled.swal2-cancel{border-radius:11px!important}
.swal2-toast{border-left:4px solid var(--blue)!important}
.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:8px;width:calc(100% - 28px);max-width:380px;pointer-events:none}
.toast{pointer-events:auto;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:13.5px;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.05)}
.toast.out{animation:toastOut .3s ease forwards}
.toast .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.toast.success .ic{background:var(--green)}.toast.error .ic{background:var(--red)}.toast.warning .ic{background:var(--orange)}.toast.info .ic{background:var(--blue)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px)}}
</style>
